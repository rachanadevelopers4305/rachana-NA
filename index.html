<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Rachana NA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#697386;--brand:#3157d5;--line:#e6e9f0;--green:#16845b;--red:#c63d48}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:20px}.sub{font-size:12px;color:var(--muted)}.logout{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px}.wrap{max-width:1100px;margin:auto;padding:18px}.nav{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.nav button{white-space:nowrap;border:0;background:#e9edf8;padding:10px 14px;border-radius:12px;color:#36425a}.nav button.active{background:var(--brand);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.stat b{display:block;font-size:25px;margin-top:7px}.muted{color:var(--muted);font-size:13px}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.section h2{font-size:18px;margin:0}.primary{background:var(--brand);color:#fff;border:0;border-radius:11px;padding:10px 14px}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{font-size:12px;padding:5px 8px;border-radius:999px;background:#edf2ff;color:#3157d5}.pill.green{background:#e7f7f0;color:var(--green)}.pill.red{background:#fff0f1;color:var(--red)}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 15px 40px #18234a12}.loginbox h1{margin:0 0 4px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal{position:fixed;inset:0;background:#17203355;display:grid;place-items:center;padding:18px;z-index:20}.modalbox{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:20px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.secondary{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px}.hidden{display:none!important}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:720px){.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.wrap{padding:14px}.top{padding:12px 14px}}
</style></head>
<body>
<div id="root"></div>
<script>
const SUPABASE_URL='https://ujlpaeggnhvwjofbldsj.supabase.co';
const SUPABASE_KEY='sb_publishable_UaBibzyVUUzCZ_EolDn9TA_ZTd8n26H';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let state={tab:'dashboard',user:null,clients:[],cases:[],transactions:[]};
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function renderLogin(msg='',mode='signup'){
 const isSignup=mode==='signup';
 root.innerHTML=`<div class="login"><div class="loginbox"><div class="brand">Rachana NA</div><div class="sub">Revenue • NA • Accounts Management</div><h1 style="margin-top:22px">${isSignup?'Create Admin Account':'Login'}</h1><div class="muted" style="margin:8px 0 14px">${isSignup?'આ appમાં પ્રથમ વખત છો? પહેલા તમારું Admin account બનાવો.':'તમારા બનાવેલા accountથી Login કરો.'}</div>${msg?`<div class="pill red" style="margin:10px 0">${esc(msg)}</div>`:''}<form id="authForm">${isSignup?`<div class="field"><label>તમારું નામ</label><input id="full_name" type="text" required autocomplete="name"></div>`:''}<div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" minlength="6" required autocomplete="new-password"></div><button class="primary" style="width:100%;margin-top:8px">${isSignup?'Create Admin Account':'Sign in'}</button>${isSignup?`<button type="button" id="loginBtn" class="secondary" style="width:100%;margin-top:8px">Already have an account? Login</button>`:`<button type="button" id="signupBtn" class="secondary" style="width:100%;margin-top:8px">Create first account</button>`}</form></div></div>`;
 authForm.onsubmit=isSignup?signup:login;
 if(isSignup) loginBtn.onclick=()=>renderLogin('','login'); else signupBtn.onclick=()=>renderLogin('','signup');
}
async function login(e){e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)renderLogin(error.message)}
async function signup(e){
e?.preventDefault();
const em=document.getElementById('email')?.value.trim()||'',pw=document.getElementById('password')?.value||'',name=document.getElementById('full_name')?.value.trim()||'';
if(!name||!em||pw.length<6){renderLogin('નામ, Email અને ઓછામાં ઓછો 6 અક્ષરનો Password નાખો.','signup');return}
const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:name},redirectTo:window.location.origin+window.location.pathname}});
if(error){renderLogin('Account બનાવવામાં સમસ્યા: '+error.message,'signup');return}
if(data.session){state.user=data.user;await load();return}
renderLogin('Account બની ગયું. તમારા email inbox/Spam માં confirmation email તપાસો. Email confirm કર્યા પછી Login કરો.','login');
}
async function load(){const [c,ca,t]=await Promise.all([sb.from('clients').select('*').order('created_at',{ascending:false}),sb.from('cases').select('*').order('created_at',{ascending:false}),sb.from('transactions').select('*').order('transaction_date',{ascending:false})]);state.clients=c.data||[];state.cases=ca.data||[];state.transactions=t.data||[];draw()}
function shell(content){root.innerHTML=`<div class="app"><header class="top"><div><div class="brand">Rachana NA</div><div class="sub">${esc(state.user?.email||'')}</div></div><button class="logout" id="logout">Logout</button></header><main class="wrap"><nav class="nav">${[['dashboard','Dashboard'],['clients','Clients'],['cases','NA Cases'],['payments','Payments']].map(([k,v])=>`<button class="${state.tab===k?'active':''}" data-tab="${k}">${v}</button>`).join('')}</nav>${content}</main></div>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;draw()});logout.onclick=async()=>{await sb.auth.signOut()}}
function draw(){if(state.tab==='dashboard')drawDashboard();else if(state.tab==='clients')drawClients();else if(state.tab==='cases')drawCases();else drawPayments()}
function drawDashboard(){const total=state.cases.reduce((a,x)=>a+Number(x.total_amount||0),0),received=state.cases.reduce((a,x)=>a+Number(x.received_amount||0),0);shell(`<div class="section"><div><h2>Dashboard</h2><div class="muted">તમારી ઓફિસનું ઝડપી overview</div></div><button class="primary" onclick="openClient()">+ New Client</button></div><div class="grid"><div class="card stat"><span class="muted">Clients</span><b>${state.clients.length}</b></div><div class="card stat"><span class="muted">Open Cases</span><b>${state.cases.filter(x=>x.status==='open').length}</b></div><div class="card stat"><span class="muted">Total Amount</span><b>${money(total)}</b></div><div class="card stat"><span class="muted">Pending</span><b>${money(Math.max(0,total-received))}</b></div></div><div class="section"><h2>Recent Cases</h2></div><div class="list">${state.cases.slice(0,5).map(caseRow).join('')||'<div class="card empty">No cases yet</div>'}</div>`)}
function caseRow(x){const client=state.clients.find(c=>c.id===x.client_id);const pending=Math.max(0,Number(x.total_amount||0)-Number(x.received_amount||0));return `<div class="card row"><div><b>${esc(x.title)}</b><div class="muted">${esc(client?.name||'No client')} • ${esc(x.case_type||'NA')}</div></div><div style="text-align:right"><span class="pill ${x.status==='completed'?'green':''}">${esc(x.status)}</span><div class="muted">${money(pending)} pending</div></div></div>`}
function drawClients(){shell(`<div class="section"><div><h2>Clients</h2><div class="muted">Client directory</div></div><button class="primary" onclick="openClient()">+ Add Client</button></div><div class="list">${state.clients.map(c=>`<div class="card row"><div><b>${esc(c.name)}</b><div class="muted">${esc(c.phone||'')} ${c.email?'• '+esc(c.email):''}</div></div><button class="secondary" onclick="openClient('${c.id}')">Edit</button></div>`).join('')||'<div class="card empty">No clients yet</div>'}</div>`)}
function drawCases(){shell(`<div class="section"><div><h2>NA Cases</h2><div class="muted">Revenue / NA work tracking</div></div><button class="primary" onclick="openCase()">+ Add Case</button></div><div class="list">${state.cases.map(caseRow).join('')||'<div class="card empty">No cases yet</div>'}</div>`)}
function drawPayments(){const income=state.transactions.filter(t=>t.transaction_type==='income').reduce((a,t)=>a+Number(t.amount),0),expense=state.transactions.filter(t=>t.transaction_type==='expense').reduce((a,t)=>a+Number(t.amount),0);shell(`<div class="section"><div><h2>Payments</h2><div class="muted">Income & expense ledger</div></div><button class="primary" onclick="openTxn()">+ Add Entry</button></div><div class="grid"><div class="card stat"><span class="muted">Income</span><b>${money(income)}</b></div><div class="card stat"><span class="muted">Expense</span><b>${money(expense)}</b></div><div class="card stat"><span class="muted">Net</span><b>${money(income-expense)}</b></div><div class="card stat"><span class="muted">Entries</span><b>${state.transactions.length}</b></div></div><div class="section"><h2>Recent Entries</h2></div><div class="list">${state.transactions.slice(0,10).map(t=>`<div class="card row"><div><b>${esc(t.description||'Entry')}</b><div class="muted">${esc(t.payment_mode)} • ${esc(t.transaction_date)}</div></div><b style="color:${t.transaction_type==='income'?'var(--green)':'var(--red)'}">${t.transaction_type==='income'?'+':'-'}${money(t.amount)}</b></div>`).join('')||'<div class="card empty">No entries yet</div>'}</div>`)}
function modal(title,body,save){root.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="modalbox"><h2>${title}</h2>${body}<div class="actions"><button class="secondary" onclick="modal.remove()">Cancel</button><button class="primary" id="saveBtn">Save</button></div></div></div>`);saveBtn.onclick=save}
window.openClient=async(id)=>{const c=state.clients.find(x=>x.id===id)||{};modal(id?'Edit Client':'New Client',`<div class="field"><label>Name</label><input id="f_name" value="${esc(c.name||'')}"></div><div class="formgrid"><div class="field"><label>Phone</label><input id="f_phone" value="${esc(c.phone||'')}"></div><div class="field"><label>Email</label><input id="f_email" value="${esc(c.email||'')}"></div></div><div class="field"><label>Address</label><textarea id="f_address">${esc(c.address||'')}</textarea></div>`,async()=>{const payload={name:f_name.value.trim(),phone:f_phone.value.trim()||null,email:f_email.value.trim()||null,address:f_address.value.trim()||null};if(!payload.name)return alert('Name required');const r=id?await sb.from('clients').update(payload).eq('id',id):await sb.from('clients').insert(payload);if(r.error)return alert(r.error.message);modal.remove();await load()})}
window.openCase=()=>{modal('New NA Case',`<div class="field"><label>Client</label><select id="f_client">${state.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Title</label><input id="f_title" placeholder="NA / Revenue work"></div><div class="formgrid"><div class="field"><label>Case Type</label><input id="f_type" placeholder="NA"></div><div class="field"><label>Status</label><select id="f_status"><option>open</option><option>pending</option><option>completed</option><option>cancelled</option></select></div></div><div class="formgrid"><div class="field"><label>Total Amount</label><input id="f_total" type="number" min="0" value="0"></div><div class="field"><label>Received Amount</label><input id="f_received" type="number" min="0" value="0"></div></div><div class="field"><label>Due Date</label><input id="f_due" type="date"></div>`,async()=>{if(!f_client.value)return alert('Add a client first');const r=await sb.from('cases').insert({client_id:f_client.value,title:f_title.value.trim(),case_type:f_type.value.trim()||null,status:f_status.value,total_amount:Number(f_total.value||0),received_amount:Number(f_received.value||0),due_date:f_due.value||null});if(r.error)return alert(r.error.message);modal.remove();await load()})}
window.openTxn=()=>{modal('New Payment Entry',`<div class="formgrid"><div class="field"><label>Type</label><select id="f_ttype"><option value="income">Income</option><option value="expense">Expense</option></select></div><div class="field"><label>Amount</label><input id="f_amount" type="number" min="1"></div></div><div class="formgrid"><div class="field"><label>Payment Mode</label><select id="f_mode"><option>cash</option><option>upi</option><option>bank</option><option>other</option></select></div><div class="field"><label>Date</label><input id="f_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div class="field"><label>Description</label><input id="f_desc"></div>`,async()=>{const r=await sb.from('transactions').insert({transaction_type:f_ttype.value,amount:Number(f_amount.value),payment_mode:f_mode.value,description:f_desc.value.trim()||null,transaction_date:f_date.value});if(r.error)return alert(r.error.message);modal.remove();await load()})}
sb.auth.onAuthStateChange(async(_event,session)=>{state.user=session?.user||null;if(state.user)await load();else renderLogin()});
(async()=>{const {data}=await sb.auth.getSession();if(data.session){state.user=data.session.user;await load()}else renderLogin()})();
</script></body></html>
